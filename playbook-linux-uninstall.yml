---
- name: Uninstall OpenClaw from Linux
  hosts: localhost
  connection: local
  become: true

  vars_files:
    - vars.yml

  vars:
    # Current + legacy service names
    openclaw_service_names:
      - openclaw-gateway
      - clawdbot-gateway
      - moltbot-gateway

  pre_tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: roles/linux/defaults/main.yml

    - name: Get openclaw user ID
      ansible.builtin.command: id -u {{ openclaw_user }}
      register: openclaw_uid
      changed_when: false
      failed_when: false

  tasks:
    # 1. Stop services (current + legacy names)
    - name: Stop openclaw user services
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - stop
          - "{{ item }}"
      become: true
      become_user: "{{ openclaw_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openclaw_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ openclaw_uid.stdout }}/bus"
      loop: "{{ openclaw_service_names }}"
      when: openclaw_uid.rc == 0
      failed_when: false
      changed_when: false

    # 2. Kill remaining processes
    - name: Kill remaining openclaw processes
      ansible.builtin.command: pkill -u {{ openclaw_user }} -f openclaw
      failed_when: false
      changed_when: false

    # 3. Disable + remove service units (current + legacy)
    - name: Disable openclaw user services
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - disable
          - "{{ item }}"
      become: true
      become_user: "{{ openclaw_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openclaw_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ openclaw_uid.stdout }}/bus"
      loop: "{{ openclaw_service_names }}"
      when: openclaw_uid.rc == 0
      failed_when: false
      changed_when: false

    - name: Remove openclaw user service files (including backups)
      ansible.builtin.file:
        path: "{{ openclaw_home }}/.config/systemd/user/{{ item }}"
        state: absent
      loop: >-
        {{
          openclaw_service_names
          | product(['.service', '.service.bak'])
          | map('join')
          | list
        }}

    - name: Reload user systemd daemon
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - daemon-reload
      become: true
      become_user: "{{ openclaw_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openclaw_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ openclaw_uid.stdout }}/bus"
      when: openclaw_uid.rc == 0
      failed_when: false
      changed_when: false

    # 4. Disable linger
    - name: Disable lingering for openclaw user
      ansible.builtin.command: loginctl disable-linger {{ openclaw_user }}
      when: openclaw_uid.rc == 0
      failed_when: false
      changed_when: false

    # 5. Uninstall pnpm package
    - name: Uninstall openclaw pnpm package
      ansible.builtin.command:
        argv:
          - pnpm
          - uninstall
          - -g
          - openclaw
      become: true
      become_user: "{{ openclaw_user }}"
      environment:
        PNPM_HOME: "{{ openclaw_home }}/.local/share/pnpm"
        PATH: "{{ openclaw_home }}/.local/bin:{{ homebrew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
        HOME: "{{ openclaw_home }}"
      failed_when: false
      changed_when: true

    # 6. Remove all data
    - name: Remove OpenClaw config directory
      ansible.builtin.file:
        path: "{{ openclaw_config_dir }}"
        state: absent

    - name: Remove Playwright browser cache
      ansible.builtin.file:
        path: "{{ openclaw_home }}/.cache/ms-playwright"
        state: absent

    - name: Remove pnpm global store
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ openclaw_home }}/.local/share/pnpm"
        - "{{ openclaw_home }}/.local/bin"
        - "{{ openclaw_home }}/.npmrc"

    # 7. Clean shell profiles
    - name: Remove OPENCLAW/CLAWDBOT env vars from shell profiles
      ansible.builtin.lineinfile:
        path: "{{ openclaw_home }}/{{ item }}"
        regexp: '^\s*export\s+(OPENCLAW_|CLAWDBOT_)'
        state: absent
      loop:
        - .profile
        - .bashrc
        - .bash_profile
      failed_when: false

    - name: Remove openclaw bash completion source from shell profiles
      ansible.builtin.lineinfile:
        path: "{{ openclaw_home }}/{{ item }}"
        regexp: 'completions/openclaw\.bash'
        state: absent
      loop:
        - .profile
        - .bashrc
        - .bash_profile
      failed_when: false

    # 8. Clean temp files
    - name: Remove openclaw temp files
      ansible.builtin.shell:
        cmd: set -o pipefail && rm -rf /tmp/*openclaw* /tmp/*clawdbot*
        executable: /bin/bash
      failed_when: false
      changed_when: false

    - name: Display uninstall summary
      ansible.builtin.debug:
        msg: >
          OpenClaw uninstalled. The openclaw user and system infrastructure
          (Docker, Node.js, Tailscale) were preserved. Re-run playbook-linux.yml
          to reinstall.
