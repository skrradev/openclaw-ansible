---
- name: Uninstall OpenClaw from macOS
  hosts: localhost
  connection: local
  become: true

  vars_files:
    - vars.yml

  vars:
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: roles/macos/defaults/main.yml

    - name: Get openclaw user UID
      ansible.builtin.command: id -u {{ openclaw_user }}
      register: openclaw_uid
      changed_when: false
      failed_when: false

  tasks:
    # 1. Stop and unload the launchd service
    - name: Unload openclaw gateway launch agent
      ansible.builtin.command:
        argv:
          - launchctl
          - bootout
          - "gui/{{ openclaw_uid.stdout }}"
          - "{{ openclaw_home }}/Library/LaunchAgents/ai.openclaw.gateway.plist"
      when: openclaw_uid.rc == 0
      failed_when: false
      changed_when: false

    # Also try the current user context (for non-dedicated-user installs)
    - name: Unload openclaw gateway from current user (fallback)
      ansible.builtin.command:
        argv:
          - launchctl
          - bootout
          - "gui/{{ ansible_facts['user_uid'] }}"
          - "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/ai.openclaw.gateway.plist"
      failed_when: false
      changed_when: false

    # 2. Kill any remaining openclaw processes
    - name: Kill remaining openclaw processes
      ansible.builtin.command: pkill -f openclaw
      failed_when: false
      changed_when: false

    # 3. Remove launch agent plist files
    - name: Remove openclaw launch agent plist (openclaw user)
      ansible.builtin.file:
        path: "{{ openclaw_home }}/Library/LaunchAgents/ai.openclaw.gateway.plist"
        state: absent

    - name: Remove openclaw launch agent plist (current user)
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/ai.openclaw.gateway.plist"
        state: absent

    # 4. Uninstall npm/pnpm packages
    - name: Uninstall openclaw via pnpm (openclaw user)
      ansible.builtin.command:
        argv:
          - pnpm
          - uninstall
          - -g
          - openclaw
      become: true
      become_user: "{{ openclaw_user }}"
      environment:
        PNPM_HOME: "{{ openclaw_home }}/.local/share/pnpm"
        PATH: "{{ openclaw_home }}/.local/bin:{{ homebrew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
        HOME: "{{ openclaw_home }}"
      when: openclaw_uid.rc == 0
      failed_when: false
      changed_when: true

    - name: Uninstall openclaw via npm (fallback)
      ansible.builtin.command:
        argv:
          - npm
          - uninstall
          - -g
          - openclaw
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
      failed_when: false
      changed_when: true

    - name: Uninstall acpx via npm
      ansible.builtin.command:
        argv:
          - npm
          - uninstall
          - -g
          - acpx
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
      failed_when: false
      changed_when: true

    # 5. Remove OpenClaw config and data directory
    - name: Remove OpenClaw config directory (openclaw user)
      ansible.builtin.file:
        path: "{{ openclaw_config_dir }}"
        state: absent

    - name: Remove OpenClaw config directory (current user)
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.openclaw"
        state: absent

    # 6. Remove pnpm global store and local bin
    - name: Remove pnpm and npm data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ openclaw_home }}/.local/share/pnpm"
        - "{{ openclaw_home }}/.local/bin"
        - "{{ openclaw_home }}/.npmrc"

    # 7. Remove Playwright browser cache
    - name: Remove Playwright browser cache
      ansible.builtin.file:
        path: "{{ openclaw_home }}/.cache/ms-playwright"
        state: absent

    # 8. Clean shell profiles (openclaw user)
    - name: Remove openclaw zsh completion from openclaw user profile
      ansible.builtin.lineinfile:
        path: "{{ openclaw_home }}/.zshrc"
        regexp: 'completions/openclaw\.zsh'
        state: absent
      failed_when: false

    - name: Remove openclaw completion comment from openclaw user profile
      ansible.builtin.lineinfile:
        path: "{{ openclaw_home }}/.zshrc"
        regexp: '# OpenClaw Completion'
        state: absent
      failed_when: false

    - name: Remove ansible managed blocks from openclaw user .zshrc
      ansible.builtin.blockinfile:
        path: "{{ openclaw_home }}/.zshrc"
        marker: "{{ item }}"
        state: absent
      loop:
        - "# {mark} ANSIBLE MANAGED BLOCK - OpenClaw config"
        - "# {mark} ANSIBLE MANAGED BLOCK - OpenClaw pnpm"
      failed_when: false

    # 9. Clean shell profiles (current user, for non-dedicated-user installs)
    - name: Remove openclaw zsh completion from current user profile
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['user_dir'] }}/.zshrc"
        regexp: 'completions/openclaw\.zsh'
        state: absent
      failed_when: false

    - name: Remove openclaw completion comment from current user profile
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['user_dir'] }}/.zshrc"
        regexp: '# OpenClaw Completion'
        state: absent
      failed_when: false

    # 10. Remove cached data
    - name: Remove openclaw cache files
      ansible.builtin.shell:
        cmd: set -o pipefail && rm -rf ~/Library/Caches/claude-cli-nodejs/*openclaw*
        executable: /bin/bash
      failed_when: false
      changed_when: false

    # 11. Remove temp files
    - name: Remove openclaw temp files
      ansible.builtin.shell:
        cmd: set -o pipefail && rm -rf /tmp/*openclaw*
        executable: /bin/bash
      failed_when: false
      changed_when: false

    # 12. Optionally remove the openclaw system user
    - name: Remove openclaw system user
      ansible.builtin.user:
        name: openclaw
        state: absent
        remove: true
      when: openclaw_remove_user | default(false) | bool

    - name: Remove openclaw group
      ansible.builtin.group:
        name: openclaw
        state: absent
      when: openclaw_remove_user | default(false) | bool

    - name: Display uninstall summary
      ansible.builtin.debug:
        msg: >
          OpenClaw uninstalled from macOS. Infrastructure (Homebrew, Node.js,
          Docker, Tailscale) was preserved.
          {{ 'The openclaw user was removed.' if (openclaw_remove_user | default(false) | bool) else 'The openclaw user was preserved. Pass -e openclaw_remove_user=true to also remove the user.' }}
          Re-run playbook-macos.yml to reinstall.
