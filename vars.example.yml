---
# OpenClaw Ansible variables example
# Copy to vars.yml and edit values for your environment.

# Installation mode: release or development
openclaw_install_mode: "release"
# Release version to install from npm (default: latest)
openclaw_version: "latest"

# SSH keys for openclaw user
openclaw_ssh_keys:
  - "ssh-ed25519 AAAA... replace-with-your-openclaw-key"

# Admin user — used for SSH strict hardening preflight and (optionally) user creation
# Cloud images (AWS/GCP): set to existing user, leave admin_ssh_keys empty
# Bare metal: set username + keys to create the user
admin_user: "ubuntu"
admin_ssh_keys: []

# Optional
tailscale_authkey: ""
nodejs_version: "22.x"
timezone: "UTC"  # Linux only (if empty, role uses UTC)

# Development mode overrides (optional)
# openclaw_repo_url: "https://github.com/openclaw/openclaw.git"
# openclaw_repo_branch: "main"
