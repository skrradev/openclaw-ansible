---
# OpenClaw Ansible variables example
# Copy to vars.yml and edit values for your environment.

# Installation mode: release or development
openclaw_install_mode: "release"

# SSH keys for openclaw user
openclaw_ssh_keys:
  - "ssh-ed25519 AAAA... replace-with-your-openclaw-key"

# Linux admin model
# Set the admin account used by strict SSH checks.
# Cloud images (AWS/GCP): usually ubuntu/debian/ec2-user.
# Bare metal: set this to the admin account you created.
ssh_admin_user: "ubuntu"

# Optional bootstrap admin creation (bare metal)
admin_user: ""
admin_ssh_keys: []

# Legacy fallback (prefer ssh_admin_user)
existing_admin_user: ""

# Optional
tailscale_authkey: ""
nodejs_version: "22.x"

# Development mode overrides (optional)
# openclaw_repo_url: "https://github.com/openclaw/openclaw.git"
# openclaw_repo_branch: "main"
