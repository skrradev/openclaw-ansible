---
# macOS Node.js installation via Homebrew

- name: Install Node.js via Homebrew
  community.general.homebrew:
    name: "node@{{ nodejs_version }}"
    state: present
  become: false
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Link Node.js into Homebrew prefix
  ansible.builtin.command: brew link --overwrite node@{{ nodejs_version }}
  become: false
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  register: brew_link_result
  changed_when: "'Linking' in brew_link_result.stdout"
  failed_when:
    - brew_link_result.rc != 0
    - "'Already linked' not in brew_link_result.stderr"

- name: Install pnpm globally
  ansible.builtin.command: npm install -g pnpm
  become: false
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    creates: "{{ homebrew_prefix }}/bin/pnpm"

