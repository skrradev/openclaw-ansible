---
# OpenClaw default variables (Linux)

# Tailscale settings
tailscale_authkey: ""  # Optional: set to auto-connect during installation

# Node.js version
nodejs_version: "22.x"

# OpenClaw settings
openclaw_port: 3000

# OpenClaw config directory
openclaw_config_dir: "{{ openclaw_home }}/.openclaw"

# User settings (will be created as system user)
openclaw_user: openclaw
openclaw_home: /home/openclaw

# Linux-specific settings
package_manager: apt
homebrew_prefix: /home/linuxbrew/.linuxbrew

# Timezone settings (Linux)
# If empty, timezone role falls back to UTC.
timezone: ""

# OpenClaw release version to install from npm
openclaw_version: "latest"

# SSH keys for openclaw user
# Add your public SSH keys here to allow SSH access as openclaw user
# Example:
#   openclaw_ssh_keys:
#     - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx user@host"
#     - "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDxxxxxxxxxxxxxxxxxxxxxxx user@host"
openclaw_ssh_keys: []

# Admin user (optional)
# Set the username of the admin account. Leave empty to skip.
#   - With admin_ssh_keys: creates the user, adds keys, grants NOPASSWD sudo (bare metal)
#   - Without admin_ssh_keys: assumes user already exists (cloud images like AWS/GCP)
# Also used by playbook-linux-ssh-strict.yml to verify key+sudo access before hardening.
# Example: ubuntu (AWS), debian (GCP), adminops (bare metal)
admin_user: ""
admin_ssh_keys: []

# Browser settings
# Default is true; set to false only if browser automation is not needed.
openclaw_browser_enabled: true

# SSH lockdown: additional CIDRs allowed to SSH besides Tailscale
# Used by playbook-linux-ssh-lockdown.yml
# Example: ["35.235.240.0/20"] for GCP IAP
allow_ssh_cidrs: []
