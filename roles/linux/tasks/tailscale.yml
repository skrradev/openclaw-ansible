---
# Linux Tailscale installation (Debian/Ubuntu)

- name: Set distribution facts for Tailscale
  ansible.builtin.set_fact:
    tailscale_distro: "{{ ansible_facts['distribution'] | lower }}"
    tailscale_release: "{{ ansible_facts['distribution_release'] }}"

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_distro }}/{{ tailscale_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Add Tailscale repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ tailscale_distro }} {{ tailscale_release }} main"
    filename: tailscale
    state: present
    update_cache: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Connect to Tailscale network
  ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }}
  when: tailscale_authkey | length > 0
  changed_when: true

