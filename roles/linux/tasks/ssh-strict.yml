---
# Strict SSH hardening (key-only, no root login).
# Run this after confirming non-root admin key access works.

- name: Assert admin_user is set
  ansible.builtin.assert:
    that:
      - admin_user | length > 0
    fail_msg: >-
      Strict SSH hardening requires admin_user to be set
      (e.g. -e admin_user=ubuntu for cloud, -e admin_user=adminops for bare metal).
    quiet: true

- name: Assert admin user is non-root
  ansible.builtin.assert:
    that:
      - admin_user != "root"
    fail_msg: "admin_user cannot be root because strict mode disables root SSH login."
    quiet: true

- name: Lookup admin user account
  ansible.builtin.command: "getent passwd {{ admin_user }}"
  register: admin_passwd
  changed_when: false
  failed_when: admin_passwd.rc != 0

- name: Set admin home directory
  ansible.builtin.set_fact:
    admin_home: "{{ admin_passwd.stdout.split(':')[5] }}"

- name: Check admin authorized_keys
  ansible.builtin.stat:
    path: "{{ admin_home }}/.ssh/authorized_keys"
  register: admin_authorized_keys

- name: Assert admin key access exists
  ansible.builtin.assert:
    that:
      - admin_authorized_keys.stat.exists
      - admin_authorized_keys.stat.size | int > 0
    fail_msg: >-
      admin_user ({{ admin_user }}) must have a non-empty authorized_keys
      before strict hardening.
    quiet: true

- name: Verify admin has sudo privileges
  ansible.builtin.command: "sudo -l -U {{ admin_user }}"
  register: admin_sudo
  changed_when: false
  failed_when: false

- name: Assert admin can use sudo
  ansible.builtin.assert:
    that:
      - admin_sudo.rc == 0
    fail_msg: "admin_user ({{ admin_user }}) must have sudo privileges before strict hardening."
    quiet: true

- name: Configure strict SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-openclaw-strict.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # OpenClaw strict SSH hardening
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
  register: strict_ssh_config
  notify: Restart sshd

- name: Ensure /run/sshd exists for sshd -t validation
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: '0755'
  when: strict_ssh_config.changed

- name: Validate sshd configuration after strict hardening
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  when: strict_ssh_config.changed
