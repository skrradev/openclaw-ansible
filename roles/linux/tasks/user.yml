---
# OpenClaw service user
- name: Create openclaw system user
  ansible.builtin.user:
    name: openclaw
    comment: "OpenClaw Service User"
    system: true
    shell: /bin/bash
    create_home: true
    home: /home/openclaw
    state: present

- name: Configure .bashrc for openclaw user
  ansible.builtin.blockinfile:
    path: "{{ openclaw_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - OpenClaw config"
    block: |
      # Add Homebrew (Linuxbrew) to PATH
      if [ -x "{{ homebrew_prefix }}/bin/brew" ]; then
        eval "$({{ homebrew_prefix }}/bin/brew shellenv)"
      fi

      # Add local bin to PATH
      export PATH="{{ openclaw_home }}/.local/bin:$PATH"
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0644'

- name: Add openclaw user to sudoers with scoped NOPASSWD
  ansible.builtin.copy:
    dest: /etc/sudoers.d/openclaw
    mode: '0440'
    owner: root
    group: root
    content: |
      # OpenClaw sudo permissions (scoped for security)
      #
      # SECURITY NOTE: These permissions are intentionally limited.
      # If openclaw is compromised, attackers can only:
      # - Manage the openclaw service
      # - Run basic tailscale diagnostics
      # - View openclaw logs
      #
      # To grant full tailscale control (e.g., for self-healing VPN):
      #   openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale *
      #
      # To grant full sudo (NOT RECOMMENDED):
      #   openclaw ALL=(ALL) NOPASSWD: ALL

      # Service control - openclaw-gateway service only
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/systemctl start openclaw-gateway
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/systemctl stop openclaw-gateway
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart openclaw-gateway
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/systemctl status openclaw-gateway
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/systemctl enable openclaw-gateway
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/systemctl disable openclaw-gateway
      # Tailscale - diagnostics + connect/disconnect
      # NOTE: 'up' allows flags like --advertise-exit-node. For tighter control,
      # remove 'up' and 'down' lines - operator must then manage VPN manually.
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale status
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale up *
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale down
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale ip *
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale version
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale ping *
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/tailscale whois *
      openclaw ALL=(root) NOPASSWD: /usr/bin/tailscale serve --bg --yes *
      openclaw ALL=(root) NOPASSWD: /usr/bin/tailscale serve reset
      openclaw ALL=(root) NOPASSWD: /usr/bin/tailscale serve status
      openclaw ALL=(root) NOPASSWD: /usr/bin/tailscale status --json
      openclaw ALL=(root) NOPASSWD: /usr/bin/tailscale whois --json *

      # Journal access - openclaw-gateway logs only
      openclaw ALL=(ALL) NOPASSWD: /usr/bin/journalctl -u openclaw-gateway *
    validate: /usr/sbin/visudo -cf %s

- name: Set openclaw user as primary user for installation
  ansible.builtin.set_fact:
    openclaw_user: openclaw
    openclaw_home: /home/openclaw

- name: Check if Linuxbrew prefix exists
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}"
  register: linuxbrew_prefix

- name: Ensure openclaw owns Linuxbrew prefix for runtime skill installs
  ansible.builtin.file:
    path: "{{ homebrew_prefix }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    recurse: true
  when:
    - linuxbrew_prefix.stat.exists
    - (linuxbrew_prefix.stat.pw_name | default('')) != openclaw_user or
      (linuxbrew_prefix.stat.gr_name | default('')) != openclaw_user

# DBus and systemd user services
- name: Get openclaw user ID
  ansible.builtin.command: id -u openclaw
  register: openclaw_uid
  changed_when: false

- name: Enable lingering for openclaw user (allows systemd user services without login)
  ansible.builtin.command: loginctl enable-linger openclaw
  changed_when: false

- name: Create runtime directory for openclaw user
  ansible.builtin.file:
    path: "/run/user/{{ openclaw_uid.stdout }}"
    state: directory
    owner: openclaw
    group: openclaw
    mode: '0700'

- name: Start systemd user manager for openclaw
  ansible.builtin.command:
    argv:
      - systemctl
      - start
      - "user@{{ openclaw_uid.stdout }}.service"
  changed_when: false

- name: Store openclaw UID as fact for later use
  ansible.builtin.set_fact:
    openclaw_uid_value: "{{ openclaw_uid.stdout }}"

# SSH key configuration
- name: Create .ssh directory for openclaw user
  ansible.builtin.file:
    path: "{{ openclaw_home }}/.ssh"
    state: directory
    owner: openclaw
    group: openclaw
    mode: '0700'

- name: Add SSH authorized keys for openclaw user
  ansible.posix.authorized_key:
    user: openclaw
    state: present
    key: "{{ item }}"
  loop: "{{ openclaw_ssh_keys }}"
  when: openclaw_ssh_keys | length > 0

- name: Set XDG_RUNTIME_DIR in .bashrc for openclaw user
  ansible.builtin.lineinfile:
    path: /home/openclaw/.bashrc
    line: 'export XDG_RUNTIME_DIR=/run/user/$(id -u)'
    state: present
    create: true
    owner: openclaw
    group: openclaw
    mode: '0644'

- name: Set DBUS_SESSION_BUS_ADDRESS in .bashrc for openclaw user
  ansible.builtin.blockinfile:
    path: /home/openclaw/.bashrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DBus config"
    block: |
      # DBus session bus configuration
      if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
        if [ -f "${XDG_RUNTIME_DIR}/bus" ]; then
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
        fi
      fi
    create: true
    owner: openclaw
    group: openclaw
    mode: '0644'
