---
- name: Create OpenClaw directories (structure only, no config files)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openclaw_config_dir }}", mode: '0755' }
    - { path: "{{ openclaw_config_dir }}/sessions", mode: '0755' }
    - { path: "{{ openclaw_config_dir }}/credentials", mode: '0700' }
    - { path: "{{ openclaw_config_dir }}/data", mode: '0755' }
    - { path: "{{ openclaw_config_dir }}/logs", mode: '0755' }
    - { path: "{{ openclaw_home }}/.local/bin", mode: '0755' }

- name: Set npm global prefix to user-local directory
  ansible.builtin.command:
    argv:
      - npm
      - config
      - set
      - prefix
      - "{{ openclaw_home }}/.local"
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
  changed_when: false

- name: Install OpenClaw globally as openclaw user (using npm)
  ansible.builtin.command:
    argv:
      - npm
      - install
      - -g
      - "openclaw@{{ openclaw_version | default('latest', true) }}"
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    PATH: "{{ openclaw_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "{{ openclaw_home }}"
  register: openclaw_install
  changed_when: "'up to date' not in ((openclaw_install.stdout | default('')) + (openclaw_install.stderr | default('')))"
