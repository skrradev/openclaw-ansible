---
- name: Create OpenClaw directories (structure only, no config files)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openclaw_config_dir }}", mode: '0755' }
    - { path: "{{ openclaw_config_dir }}/sessions", mode: '0755' }
    - { path: "{{ openclaw_config_dir }}/credentials", mode: '0700' }
    - { path: "{{ openclaw_config_dir }}/data", mode: '0755' }
    - { path: "{{ openclaw_config_dir }}/logs", mode: '0755' }

- name: Create pnpm directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0755'
  loop:
    - "{{ openclaw_home }}/.local/share/pnpm"
    - "{{ openclaw_home }}/.local/share/pnpm/store"
    - "{{ openclaw_home }}/.local/bin"

- name: Ensure pnpm directories have correct ownership
  ansible.builtin.file:
    path: "{{ openclaw_home }}/.local/share/pnpm"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    recurse: true
    mode: '0755'

- name: Configure pnpm for openclaw user
  ansible.builtin.blockinfile:
    path: "{{ openclaw_home }}/.npmrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - OpenClaw pnpm config"
    block: |
      global-dir={{ openclaw_home }}/.local/share/pnpm
      global-bin-dir={{ openclaw_home }}/.local/bin
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0644'

- name: Install OpenClaw globally as openclaw user (using pnpm)
  ansible.builtin.command:
    argv:
      - pnpm
      - install
      - -g
      - "openclaw@{{ openclaw_version | default('latest', true) }}"
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    PNPM_HOME: "{{ openclaw_home }}/.local/share/pnpm"
    PATH: "{{ openclaw_home }}/.local/bin:{{ homebrew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "{{ openclaw_home }}"
  register: openclaw_install
  changed_when: "'Already up to date' not in ((openclaw_install.stdout | default('')) + (openclaw_install.stderr | default('')))"
