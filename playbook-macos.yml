---
- name: Install OpenClaw on macOS
  hosts: localhost
  connection: local
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:

    - name: Install Ansible collections
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml
      args:
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Check if Homebrew is installed
      ansible.builtin.stat:
        path: /opt/homebrew/bin/brew
      register: homebrew_check

    - name: Install Homebrew (macOS)
      ansible.builtin.shell: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        creates: /opt/homebrew/bin/brew
      when: not homebrew_check.stat.exists
      become: false

    - name: Allow passwordless installer for Homebrew cask installs
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/homebrew-cask-{{ ansible_facts['env']['USER'] }}"
        mode: '0440'
        owner: root
        group: wheel
        content: "{{ ansible_facts['env']['USER'] }} ALL=(root) NOPASSWD: /usr/sbin/installer *\n"
        validate: /usr/sbin/visudo -cf %s

    - name: Add Homebrew to PATH for current session
      ansible.builtin.set_fact:
        ansible_env: "{{ ansible_facts['env'] | combine({'PATH': '/opt/homebrew/bin:' + (ansible_facts['env']['PATH'] | default(lookup('env', 'PATH')))}) }}"
      changed_when: false

  roles:
    - macos

  post_tasks:
    - name: Remove temporary passwordless installer sudoers rule
      ansible.builtin.file:
        path: "/etc/sudoers.d/homebrew-cask-{{ ansible_facts['env']['USER'] }}"
        state: absent
